$kind: http-request
id: bc920f71-6b42-57e8-8f99-347a0426b0af
method: GET
url: "{{baseUrl}}/auth/session"
description: Validate a browser session and read its expiry, account timezone
  and today's local date. Accepts a vls_ Bearer token or the API cookie from
  UI_BASE_URL.
headers:
  Accept: application/json
  Origin: "{{uiUrl}}"
auth:
  - id: 6a832c41-1d4f-57f8-8a45-bc0c28432203
    type: bearer
    name: Read-only browser session
    credentials:
      token: "{{browserSessionToken}}"
