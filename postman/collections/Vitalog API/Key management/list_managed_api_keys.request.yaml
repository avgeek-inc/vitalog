$kind: http-request
id: 164cc3b6-8400-51b2-8103-1799c2be9583
description: Using a browser or management session, list unrevoked API keys and
  MCP connections, filtering before pagination. Excludes dashboard and
  management sessions. Never returns tokens or hashes.
method: GET
url: "{{baseUrl}}/auth/key-management/api-keys"
headers:
  Accept: application/json
auth:
  - id: c3858897-88d5-5856-83d2-19e48a0e3b3b
    type: bearer
    name: Key management session
    credentials:
      token: "{{keyManagementToken}}"
