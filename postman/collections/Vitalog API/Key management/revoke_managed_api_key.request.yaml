  session IDs are rejected. Accepts no body or query arguments.
method: DELETE
url: "{{baseUrl}}/auth/key-management/api-keys/{{apiKeyId}}"
headers:
  Accept: application/json
auth:
  - id: 8191614a-44a7-573c-8124-a0bcb116e3f0
    type: bearer
    name: Key management session
    credentials:
      token: "{{keyManagementToken}}"
