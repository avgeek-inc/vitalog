$kind: http-request
id: 7d3a8cc5-78b4-56cf-8bca-e429336a5bda
description: Generate a 30-day API key using an authenticated management
  session. No name, body or query arguments. The complete key is returned once.
method: POST
url: "{{baseUrl}}/auth/key-management/api-keys"
headers:
  Accept: application/json
auth:
  - id: 70fcf599-ae57-59ca-86e8-2aa7947636ea
    type: bearer
    name: Key management session
    credentials:
      token: "{{keyManagementToken}}"
