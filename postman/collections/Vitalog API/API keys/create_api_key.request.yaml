$kind: http-request
id: 541bd03c-b799-57ec-87fd-641654d8f9b6
description: Generate a personal API key using root credentials and required
  name, access, includeAdmin and expiresAt settings. Null expiry means Never.
  Read keys read health data; Edit keys also write it; Administrative
  permissions also allow operator readiness and OpenAPI inspection. Keys cannot
  manage credentials or account settings. The complete key is returned once.
method: POST
url: "{{baseUrl}}/auth/api-keys"
headers:
  Accept: application/json
  Content-Type: application/json
auth:
  - id: 2ed2837f-608c-5dd5-8c8b-fdc94d6360b2
    type: noauth
    name: Root credentials in JSON
body:
  type: json
  content: |-
    {
      "email": "{{rootEmail}}",
      "password": "{{rootPassword}}",
      "name": "Personal automation",
      "access": "read",
      "includeAdmin": false,
      "expiresAt": null
    }
