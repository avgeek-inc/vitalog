$kind: http-request
id: 7facc1b1-2985-5419-80b1-5e281f11b93b
description: Revoke a generated API key, OAuth connection or browser session by
  ID. Already revoked records return their metadata. Requires the environment
  AUTH_KEY.
method: DELETE
url: "{{baseUrl}}/v1/api-keys/{{apiKeyId}}"
headers:
  Accept: application/json
auth:
  - id: 9ba86040-123a-5a40-8cdf-f20c19c79486
    type: bearer
    name: Primary AUTH_KEY
    credentials:
      token: "{{rootAuthKey}}"
