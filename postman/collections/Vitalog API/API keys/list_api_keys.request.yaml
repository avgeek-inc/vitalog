$kind: http-request
id: c7a597fc-f4de-511b-8347-d7c99fb0953c
description: List generated API keys, OAuth connections and browser session
  metadata, including expiry and revocation status. Requires the environment
  AUTH_KEY; never returns keys, tokens or hashes.
method: GET
url: "{{baseUrl}}/v1/api-keys?limit=50&offset=0"
headers:
  Accept: application/json
auth:
  - id: b9dac5fa-3669-5219-8f43-8b55404e6e1f
    type: bearer
    name: Primary AUTH_KEY
    credentials:
      token: "{{rootAuthKey}}"
