$kind: http-request
id: e64c63cf-79be-503c-8301-fb654b29dfe6
method: POST
url: "{{baseUrl}}/oauth/token"
description: Authorization-code exchange with S256 PKCE and exact client,
  consented callback and canonical MCP resource binding. Public clients use
  client_id without a secret; confidential clients use their declared
  client_secret_basic, client_secret_post or private_key_jwt method. JWT clients
  send a signed assertion with registered public keys and a unique jti; replay
  is blocked across restarts. Basic credentials or a verified assertion identify
  the client when client_id is omitted from the body. Unknown OAuth parameters
  are ignored. No refresh or client-credentials grants. Atomically consumes the
  code and creates a scoped 30-day MCP token and its API-key management record.
  The primary AUTH_KEY can list or revoke this record. Revocation is checked on
  every MCP request.
headers:
  Accept: application/json
  Content-Type: application/x-www-form-urlencoded
auth:
  - id: 4f3e47f3-2a7c-5033-8339-3358d60079c2
    type: noauth
    name: OAuth protocol; no inherited key
body:
  type: text
  content: grant_type=authorization_code&code={{oauthCode}}&client_id={{oauthClientId}}&redirect_uri={{oauthRedirectUri}}&resource={{baseUrl}}%2Fmcp&code_verifier={{oauthVerifier}}
