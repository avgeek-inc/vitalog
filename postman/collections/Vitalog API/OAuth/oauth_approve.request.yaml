$kind: http-request
id: a030bccd-7a24-57f0-8489-4d910a579517
method: POST
url: "{{baseUrl}}/oauth/approve"
description: Requires the flow cookie, exact same-origin Origin header and
  matching CSRF token. Allow also requires an active generated API key in
  Authorization; AUTH_KEY is rejected. Cancel does not need the API key. Returns
  a validated ChatGPT redirect containing state and iss; approval includes a
  single-use five-minute code.
headers:
  Accept: application/json
  Content-Type: application/json
  Origin: "{{baseUrl}}"
  Authorization: Bearer {{oauthApiKey}}
auth:
  - id: 1f52505e-b06b-5047-8733-6378216d8767
    type: noauth
    name: OAuth protocol; no inherited key
body:
  type: json
  content: |-
    {
      "csrf_token": "{{oauthCsrf}}",
      "action": "allow"
    }
