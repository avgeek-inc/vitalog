$kind: http-request
id: 541e087c-aa97-5d7e-815e-aeea923d96a3
description: Stateless MCP requires the OAuth access token obtained by sign-in,
  consent and PKCE exchange. Initialize before discovery and calls.
method: POST
url: "{{baseUrl}}/mcp"
auth:
  - type: bearer
    credentials:
      token: "{{oauthAccessToken}}"
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  MCP-Protocol-Version: 2025-11-25
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 20,
      "method": "tools/call",
      "params": {
        "name": "health_set_goal",
        "arguments": {
          "idempotency_key": "{{idempotencyKey}}",
          "metric": "hydration:water_ml",
          "target": 2500,
          "expected_version": 0
        }
      }
    }
