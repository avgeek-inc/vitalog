$kind: http-request
id: 3e27f1d1-d860-5aae-8f08-15714fdd0992
description: Stateless MCP requires the OAuth access token obtained by sign-in,
  consent and PKCE exchange. Initialize before discovery and calls.
method: POST
url: "{{baseUrl}}/mcp"
auth:
  - type: bearer
    credentials:
      token: "{{oauthAccessToken}}"
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  MCP-Protocol-Version: 2025-11-25
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 25,
      "method": "tools/call",
      "params": {
        "name": "health_create_attachment_upload",
        "arguments": {
          "idempotency_key": "{{idempotencyKey}}",
          "filename": "meal.jpg",
          "content_type": "image/jpeg",
          "byte_length": {{attachmentByteLength}},
          "sha256": "{{attachmentSha256}}"
        }
      }
    }
