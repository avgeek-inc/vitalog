$kind: http-request
id: c902df52-2bf3-58cd-85df-ee2abfd8c7e9
description: Stateless MCP requires the OAuth access token obtained by sign-in,
  consent and PKCE exchange. Initialize before discovery and calls.
method: POST
url: "{{baseUrl}}/mcp"
auth:
  - type: bearer
    credentials:
      token: "{{oauthAccessToken}}"
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  MCP-Protocol-Version: 2025-11-25
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 15,
      "method": "tools/call",
      "params": {
        "name": "health_log_intake",
        "arguments": {
          "idempotency_key": "{{idempotencyKey}}",
          "occurred_on": "2026-09-10",
          "timezone": "Asia/Kolkata",
          "provenance": {
            "source_type": "manual",
            "value_kind": "reported"
          },
          "data": {
            "product_name": "Supplied supplement",
            "category": "supplement",
            "status": "taken",
            "administered_quantity": {
              "kind": "quantity",
              "value": 1,
              "unit": "tablet"
            }
          }
        }
      }
    }
