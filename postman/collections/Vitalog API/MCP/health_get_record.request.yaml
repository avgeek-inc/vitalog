$kind: http-request
id: 54709787-737d-5b2f-82ff-809869574540
description: Stateless MCP requires the OAuth access token obtained by sign-in,
  consent and PKCE exchange. Initialize before discovery and calls.
method: POST
url: "{{baseUrl}}/mcp"
auth:
  - type: bearer
    credentials:
      token: "{{oauthAccessToken}}"
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  MCP-Protocol-Version: 2025-11-25
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 7,
      "method": "tools/call",
      "params": {
        "name": "health_get_record",
        "arguments": {
          "id": "{{recordId}}",
          "include_history": true,
          "history_limit": 100
        }
      }
    }
