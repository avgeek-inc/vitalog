$kind: http-request
id: 6afcf757-7a01-548b-86e5-311b3193c41e
description: Stateless MCP requires the OAuth access token obtained by sign-in,
  consent and PKCE exchange. Initialize before discovery and calls.
method: POST
url: "{{baseUrl}}/mcp"
auth:
  - type: bearer
    credentials:
      token: "{{oauthAccessToken}}"
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  MCP-Protocol-Version: 2025-11-25
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 29,
      "method": "tools/call",
      "params": {
        "name": "health_get_attachment_download",
        "arguments": {
          "id": "{{attachmentId}}"
        }
      }
    }
