$kind: http-request
id: 4ce7b3d9-0ed4-508d-810d-aac9f9446a54
description: Stateless MCP requires the OAuth access token obtained by sign-in,
  consent and PKCE exchange. Initialize before discovery and calls.
method: POST
url: "{{baseUrl}}/mcp"
auth:
  - type: bearer
    credentials:
      token: "{{oauthAccessToken}}"
headers:
  Accept: application/json, text/event-stream
  Content-Type: application/json
  MCP-Protocol-Version: 2025-11-25
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 18,
      "method": "tools/call",
      "params": {
        "name": "health_void_record",
        "arguments": {
          "id": "{{recordId}}",
          "idempotency_key": "{{idempotencyKey}}",
          "expected_version": 1,
          "reason": "Void supplied observation"
        }
      }
    }
