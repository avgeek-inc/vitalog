name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: docker build -t vitalog:ci .
      - run: npm run test:container
      - uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            .test-artifacts/verification.json
            .test-artifacts/container.json
