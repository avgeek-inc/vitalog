name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run docs:site:check
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:goals
      - run: npm run test:attachments
      - run: npm run test:auth
      - run: npm run test:oauth
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: node --import tsx scripts/security-verification.ts
      - run: node --import tsx scripts/summary-verification.ts
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:container
      - run: npm run test:towbar
      - run: npm run test:build-budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .test-artifacts/verification.json
            .test-artifacts/goals-verification.json
            .test-artifacts/attachments.json
            .test-artifacts/web-verification.json
            .test-artifacts/web/*.png
            .test-artifacts/container.json
            .test-artifacts/security.json
            .test-artifacts/auth.json
            .test-artifacts/oauth.json
            .test-artifacts/summary.json
            .test-artifacts/towbar.json
            .test-artifacts/build-budget.json
            dist/vitalog-plugin.zip
