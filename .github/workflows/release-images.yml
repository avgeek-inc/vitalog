name: Publish release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag, for example v1.0.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vitalog-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        name: Validate release tag and source revision
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          test "$(jq -r .version apps/web/package.json)" = "$version"
          test "$(jq -r .version package-lock.json)" = "$version"
          commit="$(git rev-parse 'HEAD^{commit}')"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >release-state; then
            test "$(cat release-state)" = "true"
          fi
          {
            echo "commit=$commit"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  build:
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
        architecture: [amd64, arm64]
        include:
          - service: api
            image: vitalog-api
            dockerfile: Dockerfile
          - service: web
            image: vitalog-web
            dockerfile: apps/web/Dockerfile
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=ghcr.io/avgeek-oss/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.service }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Record immutable platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.service }}-${{ matrix.architecture }}
          path: digests/*
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
      - name: Assemble multi-platform images
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          for service in api web; do
            image="ghcr.io/avgeek-oss/vitalog-$service"
            sources=()
            for architecture in amd64 arm64; do
              files=(digests/digest-"$service"-"$architecture"/*)
              test "${#files[@]}" -eq 1
              digest="$(basename "${files[0]}")"
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              sources+=("$image@sha256:$digest")
            done
            docker buildx imagetools create \
              --tag "$image:$RELEASE_TAG" \
              --tag "$image:$RELEASE_VERSION" \
              --tag "$image:$RELEASE_COMMIT" \
              "${sources[@]}"
          done
      - name: Verify public images and write the release manifest
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node --import tsx scripts/release-images.ts "$RELEASE_TAG" "$RELEASE_COMMIT" vitalog-images.json
      - name: Prepare draft release and attach image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Vitalog $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" vitalog-images.json --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: vitalog-images.json
          if-no-files-found: error
          retention-days: 14

  local-installation-smoke:
    needs: [prepare, manifest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images
      - name: Test the published images without rebuilding
        run: node --import tsx scripts/container-smoke.ts --towbar --release-images vitalog-images.json
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installation-${{ matrix.architecture }}
          path: .test-artifacts/towbar.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, manifest, local-installation-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
