name: Publish container
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:goals
      - run: npm run test:auth
      - run: npm run test:oauth
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: node --import tsx scripts/security-verification.ts
      - run: node --import tsx scripts/summary-verification.ts
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:container
      - run: npm run test:towbar
      - run: npm run test:build-budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .test-artifacts/verification.json
            .test-artifacts/goals-verification.json
            .test-artifacts/web-verification.json
            .test-artifacts/web/*.png
            .test-artifacts/container.json
            .test-artifacts/security.json
            .test-artifacts/auth.json
            .test-artifacts/oauth.json
            .test-artifacts/summary.json
            .test-artifacts/towbar.json
            .test-artifacts/build-budget.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/avgeek-inc/vitalog:${{ github.ref_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/avgeek-inc/vitalog-web:${{ github.ref_name }}
