# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: vitalog
name: Vitalog API
description: Personal health ledger REST API and MCP service
deployment:
  type: image
  # Candidate tag: replace with the verified v1.0.3 digest before rollout.
  image: ghcr.io/avgeek-oss/vitalog-api:v1.0.3
  platform: linux/arm64
autoDeploy: false
rollout:
  type: recreate
  maintenanceMode: true
  reason: Authenticated database readiness during API replacement
container:
  port: 3000
  network: vitalog
  resources:
    cpus: 0.5
    memory: 512m
health:
  type: command
  command:
    - node
    - -e
    - >-
      const request = require('node:http').get('http://127.0.0.1:3000/readyz', {
        headers: {
          Authorization: 'Bearer ' + process.env.AUTH_KEY,
          Host: process.env.ALLOWED_HOSTS.split(',')[0].trim()
        }
      }, response => {
        response.resume();
        process.exit(response.statusCode === 200 ? 0 : 1);
      });
      request.on('error', () => process.exit(1));
      request.setTimeout(5000, () => { request.destroy(); process.exit(1); });
  timeoutSeconds: 90
  publicPath: /healthz
ingress:
  type: proxy
domains:
  primary: vitalog-api.avgeek.ltd
tls:
  mode: cloudflare-dns
secrets:
  runtime:
    - AUTH_KEY
    - ROOT_EMAIL
    - ROOT_PASSWORD
    - DATABASE_URL
    - ALLOWED_HOSTS
    - PUBLIC_BASE_URL
    - UI_BASE_URL
    - S3_BUCKET
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
    - S3_ENDPOINT
    - S3_REGION
    - S3_FORCE_PATH_STYLE
    - S3_PREFIX
environments:
  production:
    server: 13.204.184.47
