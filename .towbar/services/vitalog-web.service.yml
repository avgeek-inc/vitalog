# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: vitalog-web
name: Vitalog UI
description: HeroUI daily and weight views, API keys and MCP authorization
deployment:
  type: image
  image: ghcr.io/avgeek-oss/vitalog-web:v1.0.2@sha256:884dc43a11f8f63f8a44726a2b291a239762292d67e79cabaddf3f4f124fba67
  platform: linux/arm64
autoDeploy: false
container:
  port: 3000
  resources:
    cpus: 0.5
    memory: 256m
health:
  type: http
  path: /healthz
  timeoutSeconds: 90
ingress:
  type: proxy
domains:
  primary: vitalog.praveent.com
tls:
  mode: cloudflare-dns
secrets:
  runtime:
    - API_BASE_URL
    - UI_BASE_URL
environments:
  production:
    server: 13.204.184.47
