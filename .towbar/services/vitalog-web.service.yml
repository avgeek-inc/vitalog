# yaml-language-server: $schema=https://towbar.dev/schemas/app.v2.json
id: vitalog-web
name: Vitalog UI
description: HeroUI daily and weight views, API keys and MCP authorization
deployment:
  type: image
  # Candidate tag: replace with the verified v1.0.3 digest before rollout.
  image: ghcr.io/avgeek-oss/vitalog-web:v1.0.3
  platform: linux/arm64
autoDeploy: false
rollout:
  type: recreate
  maintenanceMode: true
  reason: Replace the web container without reserving an additional CPU on the two-core host
container:
  port: 3000
  resources:
    cpus: 0.5
    memory: 256m
health:
  type: http
  path: /healthz
  timeoutSeconds: 90
ingress:
  type: proxy
domains:
  primary: vitalog.praveent.com
tls:
  mode: cloudflare-dns
secrets:
  runtime:
    - API_BASE_URL
    - UI_BASE_URL
environments:
  production:
    server: 13.204.184.47
