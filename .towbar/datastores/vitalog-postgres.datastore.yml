# yaml-language-server: $schema=https://towbar.dev/schemas/resource.v2.json
id: vitalog-postgres
name: Vitalog PostgreSQL
type: postgres
image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
autoDeploy: false
container:
  network: vitalog
  networkAlias: vitalog-postgres
  resources:
    cpus: 0.5
    memory: 256m
  command:
    - postgres
    - -c
    - shared_buffers=64MB
    - -c
    - max_connections=30
    - -c
    - work_mem=4MB
    - -c
    - maintenance_work_mem=32MB
secrets:
  runtime:
    - POSTGRES_USER
    - POSTGRES_DB
    - POSTGRES_PASSWORD
environments:
  production:
    server: 13.204.184.47
